[package]
name = "corex"
version = "0.1.0"
edition = "2021"
authors = ["Rogge Ramos"]
description = "CoreX is a programming language written on Rust - with Ming Ming The Cat"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Blue-Cannon/corex"
keywords = ["programming-language", "compiler", "interpreter", "corex", "mingming"]
categories = ["development-tools", "compilers"]

[[bin]]
name = "corex"
path = "src/rust/main.rs"

[dependencies]
# --- CLI & UX (Ming Ming Interface) ---
clap = { version = "4.5", features = ["derive", "cargo"] }
colored = "2.1"
indicatif = "0.17" # loading bar while compiling
inquire = "0.7" # interactive prompts
comfy-table = "7.1" # pretty tables

# --- Lexing & Parsing (.xc language) ---
logos = "0.15" # fastest lexer
pest = "2.8" # PEG parser
pest_derive = "2.8"
chumsky = "1.0" # parser combinator
rowan = "0.15" # syntax tree

# --- Error Handling (Ming Ming errors) ---
thiserror = "2.0"
anyhow = "1.0"
miette = { version = "7.2", features = ["fancy"] } # beautiful errors
ariadne = "0.4" # error reporting

# --- Compilation Backend ---
inkwell = { version = "0.4", features = ["llvm14-0"] } # LLVM
cranelift-codegen = "0.110"
cranelift-frontend = "0.110"
cranelift-module = "0.110"

# --- VM & Execution ---
wasmtime = "27.0" # run as WASM
wasmi = "0.36"

# --- Data & Config ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
ron = "0.8"

# --- Files & System ---
walkdir = "2.5"
glob = "0.3"
notify = "6.1" # file watcher for `corex watch`
dirs = "5.0"
which = "6.0"

# --- REPL & Interactivity ---
rustyline = "15.0" # for `corex repl`
rustyline-derive = "0.11"

# --- Concurrency & Performance ---
rayon = "1.10" # parallel compile
tokio = { version = "1.38", features = ["full"] }
dashmap = "6.0" # fast hashmap

# --- Utilities ---
once_cell = "1.19"
itertools = "0.13"
regex = "1.10"
lazy_static = "1.5"
uuid = { version = "1.8", features = ["v4"] }

[dev-dependencies]
criterion = "0.5" # benchmark CoreX speed
assert_cmd = "2.0"
predicates = "3.1"
